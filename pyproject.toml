[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drtran"
version = "0.0.1"
description = "Box-Jenkins transfer function models by exact maximum likelihood — the bridge from fue (univariate) to drvarma (exact VARMA likelihood)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords = [
    "transfer function", "Box-Jenkins", "time series", "exact maximum likelihood",
    "VARMA", "econometrics", "intervention analysis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fue>=0.1.7",
    "drvarma>=0.1.1",
]

[project.scripts]
# NOT `drtran`: that name is the C binary's on this system, and
# shadowing it is exactly the trap that bit `fue` once.
drtran-py = "drtran.cli:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.6", "pyfug>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
