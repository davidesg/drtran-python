[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drtran"
version = "0.1.1"
description = "Box-Jenkins transfer function models by exact maximum likelihood — the bridge from fue (univariate) to drvarma (exact VARMA likelihood)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [
    { name = "David E. Guerrero", email = "davidesg@ucm.es" },
]
keywords = [
    "transfer function", "Box-Jenkins", "time series", "exact maximum likelihood",
    "VARMA", "econometrics", "intervention analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # >=0.1.9 for the same reason as drvarma below: every fue binary wheel before
    # it was inert (cffi absent from the runtime dependencies).
    "fue>=0.1.9",
    # >=0.1.3, not 0.1.2: 0.1.2 was the first release with binary wheels but they
    # could not LOAD -- cffi was missing from its runtime dependencies, so the
    # extension silently degraded to the pure-Python fallback. Since drtran
    # scores every likelihood through drvarma's compiled `elf_c`, pinning lower
    # would let a user install the inert engine and never know.
    "drvarma>=0.1.3",
]

[project.urls]
Homepage = "https://github.com/davidesg/drtran-python"
Repository = "https://github.com/davidesg/drtran-python"
Issues = "https://github.com/davidesg/drtran-python/issues"

[project.scripts]
# NOT `drtran`: that name is the C binary's on this system, and
# shadowing it is exactly the trap that bit `fue` once.
drtran-py = "drtran.cli:main"
mtram = "drtran.mcp_server:main"   # transfer-model MCP (pip install "drtran[mcp]")

[project.optional-dependencies]
# mcp<2 is NOT conservatism: mcp 2.0.0 REMOVED `mcp.server.fastmcp`, which is
# where FastMCP lives and what this server imports. An unbounded `mcp>=1.2`
# resolves to 2.x on any fresh install and mtram then fails to import at all.
# Verified: 1.27.2 works, 2.0.0 raises ModuleNotFoundError. Lift the cap only
# after porting the import.
mcp = ["mcp>=1.2,<2", "matplotlib>=3.6", "jinja2>=3.0", "drvarma>=0.1.3"]
plots = ["matplotlib>=3.6", "pyfug>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: walks the whole ladder (art -> fue -> mtram); ~50 s",
]
